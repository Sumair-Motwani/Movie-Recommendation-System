{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card p-4 bg-dark border-light">
            <h2 class="text-center mb-4">Add New Movie</h2>
            
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label>Movie Title</label>
                        <input type="text" name="title" class="form-control" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label>Release Year</label>
                        <input type="number" name="year" class="form-control" required>
                    </div>
                </div>
                
                <div class="mb-3">
                    <label>Description</label>
                    <textarea name="description" class="form-control" rows="3" required></textarea>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label>Poster URL (Image Link)</label>
                        <input type="url" name="poster" class="form-control" placeholder="https://..." required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label>Primary Genre</label>
                        <select name="genre_id" class="form-select">
                            {% for g in genres %}
                                <option value="{{ g.GenreID }}">{{ g.GenreName }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn btn-success w-100">Add Movie to Database</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
